name: Draft release

on:
  workflow_call:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Verify tag still points to the built commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download plugin variants
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: plugin-variants
          path: artifacts

      - name: Prepare draft release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifacts: artifacts/*.zip
          artifactErrorsFailBuild: true
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
          skipIfReleaseExists: true
          updateOnlyUnreleased: true
          generateReleaseNotes: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
